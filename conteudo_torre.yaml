pagina_12_fechamento:
  habilitada: true
  titulo: "Fechamento: o que os seis meses mostram"
  subtitulo: "B1 ({b1_meses}) vs B3 ({b3_meses}): início e fim do semestre"
  titulo_analise: "A leitura completa"
  texto_analise: >-
    Boa parte da melhora de B2 para B3 é explicada por rodarmos menos km e pelo diesel ter
    recuado depois do pico de março, o que já era esperado. O dado mais revelador aparece
    quando olhamos para o semestre inteiro. Entre B1 e B3, o diesel está {var_diesel_b1} mais
    caro e a frota rodou {var_km_b1} mais km. Ainda assim, o custo por km total ficou
    praticamente estável ({var_ckm_b1_sinal}). Isso não é acaso. É reflexo direto da queda
    estrutural na manutenção por km ({var_ckm_manutencao_b1_sinal} entre B1 e B3), fruto da
    centralização de
    serviços, das oficinas fixas por filial e da renovação de frota que vêm sendo tocadas ao
    longo do semestre. Em resumo, mesmo operando em um cenário de combustível mais caro e mais
    quilometragem rodada, a Torre de Controle conseguiu segurar o custo por km no mesmo patamar
    de seis meses atrás. Isso representa uma frota genuinamente mais eficiente, não apenas um
    efeito de mercado favorável.
  observacoes: []

