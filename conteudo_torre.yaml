  corte_hodometro: 200000
  texto_analise: "Veículos com maior quilometragem e maior idade concentram os maiores custos de manutenção. O custo começa a subir de forma mais acentuada a partir da faixa de 200 mil km rodados (linha tracejada), ponto a partir do qual vale reforçar o acompanhamento preventivo."
