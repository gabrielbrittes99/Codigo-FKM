#
# ------------------------------------------------------------
# COMO ESCREVER
# ------------------------------------------------------------
# 1) Qualquer texto aceita {placeholders} que são trocados pelos
#    valores calculados. Exemplo:
#       "O custo caiu {var_ckm}, de {b2_ckm} para {b3_ckm}."
#    vira:
#       "O custo caiu 6,6%, de R$ 1,41 para R$ 1,32."
#    Todo valor em reais sai com 2 casas e no padrão brasileiro.
#
# 2) Toda página tem um campo `observacoes:` — é o seu espaço
#    para comentar aquela página (o que mudou, o que foi feito,
#    o que vamos fazer). Se ficar vazio, o box nem aparece.
#
# 3) A última página (`pagina_14_observacoes_gerais`) é o espaço
#    livre para melhorias, ações em andamento e pontos de atenção.
#
# 4) `habilitada: false` remove a página do PDF.
#
# ------------------------------------------------------------
# PLACEHOLDERS DISPONÍVEIS
# ------------------------------------------------------------
# Período:    {periodo} {ano} {mes_inicial} {mes_final}
#             {b1_meses} {b2_meses} {b3_meses}
#             {mes_b3_inicial} {mes_b3_final}
#
# Por bimestre (troque b1_ por b2_ ou b3_):
#   {b1_total} {b1_manutencao} {b1_combustivel} {b1_pedagio}
#   {b1_manutencao_k}  → em milhares (R$ 1.468,32K)
#   {b1_km} {b1_litros} {b1_consumo} {b1_diesel} {b1_passagens}
#   {b1_ckm}            → custo/km total
#   {b1_ckm_combustivel} {b1_ckm_manutencao}
#
# Variações B3 vs B2:
#   {var_total} {var_ckm} {var_manutencao} {var_combustivel}
#   {var_pedagio} {var_km} {var_diesel} {var_ckm_manutencao}
#
# Variações B3 vs B1 (semestre inteiro):
#   {var_total_b1} {var_ckm_b1} {var_km_b1} {var_diesel_b1}
#   {var_ckm_manutencao_b1}
#
# Toda variação existe em duas formas:
#   {var_ckm}        → 6,6%    (sem sinal, para "caiu 6,6%")
#   {var_ckm_sinal}  → -6,6%   (com sinal, para valores entre parênteses)
#
# Pedágio:    {delta_pedagio} {delta_passagens}
#             {top_concessionarias} {top_pracas}
# ============================================================

